[metadata]
name = mini-agent
version = 0.3.0
description = One minimal agent loop for SWE, web, CUA, and communication experiments
author = Lawrence Jang
author_email = ljang@andrew.cmu.edu
url = https://github.com/ljang0/mini-agent
long_description = file: README.md
long_description_content_type = text/markdown
license = Apache-2.0
classifiers =
    Development Status :: 3 - Alpha
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.10
    Programming Language :: Python :: 3.11
    Programming Language :: Python :: 3.12
    Programming Language :: Python :: 3.13
project_urls =
    Source = https://github.com/ljang0/mini-agent
    Issues = https://github.com/ljang0/mini-agent/issues

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.10
include_package_data = False
install_requires =
    httpx>=0.27,<1
    PyYAML>=6,<7

[options.extras_require]
cua =
web =
    pyserini>=0.44,<0.45
    transformers>=4.55,<5
swebench =
    swebench==4.1.0
dev =
    build>=1.2,<2
    mypy>=1.10,<2
    ruff>=0.12,<1
    twine>=6,<7

[options.packages.find]
where = src
include =
    mini_agent*
exclude =
    scaffoldlab*

[options.package_data]
mini_agent =
    py.typed
    profiles/**/*.yaml
    profiles/**/*.md

[options.entry_points]
console_scripts =
    mini-agent = mini_agent.cli:main
