[metadata]
name = mini-agent
version = 0.2.0
description = One minimal agent loop for SWE, web, CUA, and communication experiments
long_description = file: README.md
long_description_content_type = text/markdown
license = Apache-2.0

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.10
include_package_data = True
install_requires =
    httpx>=0.27,<1
    PyYAML>=6,<7
    regex>=2024.5

[options.extras_require]
browser =
    playwright>=1.60,<1.61

[options.packages.find]
where = src

[options.package_data]
mini_agent =
    profiles/**/*.yaml
    profiles/**/*.md

[options.entry_points]
console_scripts =
    mini-agent = mini_agent.cli:main
    scaffoldlab = scaffoldlab.cli:main
