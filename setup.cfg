[metadata]
name = scaffoldlab
version = 0.2.0
description = A provider-neutral laboratory for controlled multi-agent scaffold experiments
long_description = file: README.md
long_description_content_type = text/markdown
license = Apache-2.0

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.10
include_package_data = True
install_requires =
    httpx>=0.27,<1
    regex>=2024.5

[options.extras_require]
browser =
    playwright>=1.60,<1.61

[options.packages.find]
where = src

[options.entry_points]
console_scripts =
    scaffoldlab = scaffoldlab.cli:main
