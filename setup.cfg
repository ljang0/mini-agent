[metadata]
name = mini-agent-cmu
version = attr: mini_agent.__version__
description = One minimal agent loop for SWE, web research, computer use, and delegation
author = Lawrence Jang
author_email = ljang@andrew.cmu.edu
url = https://github.com/ljang0/mini-agent
long_description = file: README.md
long_description_content_type = text/markdown
license = Apache-2.0
keywords =
    agents
    llm
    evaluation
    swe-bench
    osworld
    browsecomp
    computer-use
    multi-agent
classifiers =
    Development Status :: 3 - Alpha
    Intended Audience :: Developers
    Intended Audience :: Science/Research
    License :: OSI Approved :: Apache Software License
    Operating System :: POSIX :: Linux
    Topic :: Scientific/Engineering :: Artificial Intelligence
    Typing :: Typed
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.10
    Programming Language :: Python :: 3.11
    Programming Language :: Python :: 3.12
    Programming Language :: Python :: 3.13
project_urls =
    Source = https://github.com/ljang0/mini-agent
    Issues = https://github.com/ljang0/mini-agent/issues
    Changelog = https://github.com/ljang0/mini-agent/blob/main/CHANGELOG.md

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.10
include_package_data = False
install_requires =
    httpx>=0.27,<1

[options.extras_require]
web-live =
    playwright>=1.48,<2
web-fixed =
    huggingface-hub==0.33.4
    pyjnius==1.6.1
    tokenizers==0.21.2
dev =
    build==1.5.0
    mypy==1.20.2
    ruff==0.15.20
    twine==6.2.0

[options.packages.find]
where = src
include =
    mini_agent*

[options.package_data]
mini_agent =
    py.typed

[options.entry_points]
console_scripts =
    mini-agent = mini_agent.cli:main
