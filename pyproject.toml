[build-system]
requires = ["setuptools==84.0.0", "wheel==0.48.0", "packaging==26.3"]
build-backend = "setuptools.build_meta"

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
extend-select = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Embedded QEMU/nginx runtime-script literals are byte-meaningful.
"src/mini_agent/runtimes/osworld_apptainer.py" = ["E501"]

[tool.mypy]
python_version = "3.10"
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

# These optional extras ship no stubs, so the diagnostic depends on whether
# they happen to be installed.  A module override keeps the check identical on
# machines that have the web-fixed extra and those that do not, without inline
# ignores that are themselves unused in one of the two cases.
[[tool.mypy.overrides]]
module = ["huggingface_hub", "jnius", "jnius_config", "tokenizers"]
ignore_missing_imports = true
