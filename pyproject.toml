[build-system]
requires = ["setuptools==84.0.0", "wheel==0.48.0", "packaging==26.3"]
build-backend = "setuptools.build_meta"

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
extend-select = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Byte-exact upstream prompt and grader literals must not be re-wrapped.
"src/mini_agent/benchmarks/web.py" = ["E501"]
# Embedded QEMU/nginx runtime-script literals are byte-meaningful.
"src/mini_agent/environments/osworld_apptainer.py" = ["E501"]

[tool.mypy]
python_version = "3.10"
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
