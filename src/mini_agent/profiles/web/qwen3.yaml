application: web
model: Qwen/Qwen3-32B
provider: openai-compatible-chat
system_prompt: ""
tools: [search]
limits:
  max_steps: 100
  max_model_calls: 100
  max_output_tokens: 10000
  max_tool_calls: 1000
  max_tool_output_bytes: 8388608
  wall_time_seconds: 900
generation:
  max_output_tokens: 10000
  top_p: 0.8
  temperature: 0.7
  chat_template_kwargs:
    enable_thinking: true
observation:
  snippet_tokens: 512
history:
  mode: linear
response_parser: qwen_mcp_tool_calls
benchmark:
  name: browsecomp_plus
  retrieval: bm25
  top_k: 5
fidelity: profile
source:
  repository: https://github.com/texttron/BrowseComp-Plus
  revision: 046949032b0328319cc9a02663a759ec601d9402
  implementation: search_agent/qwen_client.py
  task_template: search_agent/prompts.py:QUERY_TEMPLATE_NO_GET_DOCUMENT
  snippet_tokenizer: Qwen/Qwen3-0.6B
fidelity_gaps:
  - The adapter maps Qwen Agent's search-server-search function name onto local MiniAgent search, but uses a compatible Chat endpoint instead of Qwen Agent MCP.
  - The vLLM service, model weights, chat template, tokenizer, and dependencies require caller-controlled pins.
