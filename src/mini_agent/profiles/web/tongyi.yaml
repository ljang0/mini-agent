application: web
model: Alibaba-NLP/Tongyi-DeepResearch-30B-A3B
provider: openai-compatible-chat
system_prompt: ""
tools: [search]
limits:
  max_steps: 100
  max_model_calls: 100
  max_output_tokens: 10000
  max_tool_calls: 1000
  max_tool_output_bytes: 8388608
  wall_time_seconds: 900
generation:
  max_output_tokens: 10000
  temperature: 0.85
  top_p: 0.95
  presence_penalty: 1.1
observation:
  snippet_tokens: 512
history:
  mode: linear
response_parser: tongyi_react_tags
benchmark:
  name: browsecomp_plus
  retrieval: bm25
  top_k: 5
fidelity: profile
source:
  repository: https://github.com/texttron/BrowseComp-Plus
  revision: 046949032b0328319cc9a02663a759ec601d9402
  implementation: search_agent/tongyi_client.py
  task_template: search_agent/prompts.py:QUERY_TEMPLATE_NO_GET_DOCUMENT
  snippet_tokenizer: Qwen/Qwen3-0.6B
fidelity_gaps:
  - The executable adapter parses the published <tool_call> protocol and inserts local results as <tool_response>, but uses a stateless compatible-Chat transcript instead of MultiTurnReactAgent and DashScope.
  - Model weights, provider service, tokenizer/chat template, retry policy, and dependencies require caller-controlled pins.
