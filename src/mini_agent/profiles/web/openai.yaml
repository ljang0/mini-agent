application: web
model: ""
provider: openai-responses
system_prompt: ""
tools: [search]
limits:
  max_steps: 100
  max_model_calls: 100
  max_output_tokens: 10000
  max_tool_calls: 1000
  max_tool_output_bytes: 8388608
  wall_time_seconds: 900
generation:
  max_output_tokens: 10000
observation:
  snippet_tokens: 512
history:
  mode: linear
response_parser: provider_tool_calls
benchmark:
  name: browsecomp_plus
  retrieval: bm25
  top_k: 5
fidelity: profile
source:
  repository: https://github.com/texttron/BrowseComp-Plus
  revision: 046949032b0328319cc9a02663a759ec601d9402
  implementation: search_agent/openai_client.py
  task_template: search_agent/prompts.py:QUERY_TEMPLATE_NO_GET_DOCUMENT
  snippet_tokenizer: Qwen/Qwen3-0.6B
fidelity_gaps:
  - The normalized MiniAgent provider loop is not the pinned OpenAI SDK client loop and does not reproduce its retry or persistence behavior.
  - The provider adapter does not currently force the upstream tool_choice=auto and truncation=auto request fields.
  - The upstream tokenizer artifact and model snapshot are floating; callers must pin and inject the tokenizer separately.
