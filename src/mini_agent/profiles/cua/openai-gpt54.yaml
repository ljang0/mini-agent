application: cua
model: gpt-5.4
provider: openai-responses
system_prompt: openai-gpt54.md
tools: [computer]
limits:
  max_steps: 100
  max_model_calls: 100
  max_tool_calls: 100
  max_tool_output_bytes: 33554432
  wall_time_seconds: 900
generation:
  max_output_tokens: 16384
  reasoning:
    effort: xhigh
observation:
  screenshot_detail: original
  coordinate_mode: pixels
history:
  mode: linear
response_parser: provider_tool_calls
benchmark:
  name: cua_speed_run
fidelity: profile
source:
  repository: https://github.com/Pranjal2041/cua-speed-run
  revision: 7230223cbc57df68331cad32889adf01f3601651
  implementation: templates/gpt54/agent.py
fidelity_gaps:
  - Alias of the gpt54 source-informed profile; CLI must select protocol=openai for the native tool.
  - Native action translation and pending safety acknowledgement round trips are implemented; upstream incomplete-response recovery, init credential calls, and shared cost reservations remain reference-only.
  - The prompt is a compact downstream adaptation, not a verbatim system-card reproduction.
