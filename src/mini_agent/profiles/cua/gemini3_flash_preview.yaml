application: cua
model: gemini-3-flash-preview
provider: openai-compatible-chat
system_prompt: gemini3_flash_preview.md
tools: [computer]
limits: {max_steps: 100, max_model_calls: 100, max_tool_calls: 100, max_tool_output_bytes: 33554432, wall_time_seconds: 900}
generation: {max_output_tokens: 16384}
observation: {coordinate_mode: provider_pixels, screenshot_detail: original}
history: {mode: linear}
response_parser: provider_tool_calls
benchmark: {name: cua_speed_run, template: gemini3_flash_preview, tool_protocol: generic}
fidelity: profile
source: {repository: https://github.com/Pranjal2041/cua-speed-run, revision: 7230223cbc57df68331cad32889adf01f3601651, implementation: templates/gemini3_flash_preview/agent.py}
fidelity_gaps:
  - Runs only through a caller-supplied OpenAI-compatible endpoint; the upstream Gemini Interactions transport and native computer-use codec remain external.
  - Preview pricing, incomplete-turn recovery, retries, and init credential call remain external.
  - This downstream function-tool profile is not Gemini Interactions parity.
