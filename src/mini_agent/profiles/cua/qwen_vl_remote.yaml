application: cua
model: Qwen/Qwen2.5-VL-3B-Instruct
provider: openai-compatible-chat
system_prompt: qwen_vl_remote.md
tools: [computer]
limits: {max_steps: 100, max_model_calls: 100, max_tool_calls: 100, max_tool_output_bytes: 33554432, wall_time_seconds: 900}
generation: {max_output_tokens: 2048}
observation: {coordinate_mode: normalized_1000, screenshot_detail: original}
history: {mode: linear}
response_parser: provider_tool_calls
benchmark: {name: cua_speed_run, template: qwen_vl_remote, tool_protocol: generic}
fidelity: profile
source: {repository: https://github.com/Pranjal2041/cua-speed-run, revision: 7230223cbc57df68331cad32889adf01f3601651, implementation: templates/qwen_vl_remote/agent.py}
fidelity_gaps:
  - Remote VLLM_URL service identity and availability are caller-owned.
  - Normalized text-action parsing and bounded multimodal history require a model adapter.
  - Source-informed profile, not remote-service parity.
