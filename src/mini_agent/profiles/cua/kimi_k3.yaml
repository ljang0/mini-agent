application: cua
model: moonshotai/kimi-k3
provider: openai-compatible-chat
system_prompt: kimi_k3.md
tools: [computer]
limits: {max_steps: 100, max_model_calls: 100, max_tool_calls: 100, max_tool_output_bytes: 33554432, wall_time_seconds: 900}
generation: {max_output_tokens: 16384, reasoning: {effort: max}}
observation: {coordinate_mode: native_pixels, screenshot_detail: original}
history: {mode: linear}
response_parser: provider_tool_calls
benchmark: {name: cua_speed_run, template: kimi_k3, tool_protocol: generic}
fidelity: profile
source: {repository: https://github.com/Pranjal2041/cua-speed-run, revision: 7230223cbc57df68331cad32889adf01f3601651, implementation: templates/kimi_k3/agent.py}
fidelity_gaps:
  - Literal-only structured-action parser and exact thinking-history retention require model-adapter wiring.
  - OpenRouter routing, retries, and pricing remain external.
  - Source-informed profile, not hosted-model parity.
