application: cua
model: claude-sonnet-4-6
provider: anthropic-messages
system_prompt: anthropic.md
tools: [computer]
limits:
  max_steps: 100
  max_model_calls: 100
  max_tool_calls: 100
  max_tool_output_bytes: 33554432
  wall_time_seconds: 900
generation:
  max_output_tokens: 16384
observation:
  screenshot_max_width: 1280
  screenshot_max_height: 720
  coordinate_mode: scaled_pixels
history:
  mode: linear
  images_to_keep: 7
  image_removal_chunk: 5
response_parser: provider_tool_calls
benchmark:
  name: cua_speed_run
fidelity: profile
source:
  repository: https://github.com/Pranjal2041/cua-speed-run
  revision: 7230223cbc57df68331cad32889adf01f3601651
  implementation: templates/claude/agent.py
fidelity_gaps:
  - Alias of the claude source-informed profile; CLI must select protocol=anthropic for the native tool.
  - Screenshot resizing and bounded old-image compaction are implemented; zoom crops and prompt caching remain outside this compact profile.
  - Upstream complete/infeasible tools, init dependency setup, and shared cost accounting remain reference-only.
  - The prompt is a compact downstream adaptation, not a proprietary runtime claim.
