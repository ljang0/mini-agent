name: release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish-mini-agent:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
      - run: python -m pip install build==1.5.0 twine==6.2.0
      - name: Build and verify
        run: |
          set -euo pipefail
          umask 0022
          python -m build
          python -m twine check --strict dist/*
          source_version="$(PYTHONPATH=src python -c 'import mini_agent; print(mini_agent.__version__)')"
          tag_version="${GITHUB_REF_NAME#v}"
          test "$source_version" = "$tag_version" || {
            echo "tag $GITHUB_REF_NAME does not match mini_agent.__version__ $source_version" >&2
            exit 1
          }
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  publish-multi-mini-agent:
    runs-on: ubuntu-latest
    needs: publish-mini-agent
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
      - run: python -m pip install build==1.5.0 twine==6.2.0
      - name: Build and verify
        working-directory: packaging/multi-mini-agent
        run: |
          set -euo pipefail
          umask 0022
          python -m build
          python -m twine check --strict dist/*
          source_version="$(PYTHONPATH=../../src python -c 'import mini_agent; print(mini_agent.__version__)')"
          companion_version="$(python -c 'import tomllib, pathlib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')"
          test "$source_version" = "$companion_version" || {
            echo "companion version $companion_version does not match mini-agent $source_version" >&2
            exit 1
          }
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: packaging/multi-mini-agent/dist
